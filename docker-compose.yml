services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opstrace}
      POSTGRES_USER: ${POSTGRES_USER:-opstrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opstrace} -d ${POSTGRES_DB:-opstrace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers $${WEB_CONCURRENCY:-3} --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    command: >-
      sh -c "sleep 5; while true; do
      python manage.py generate_work_items || echo 'OpsTrace scheduler run failed';
      sleep 3600; done"

volumes:
  postgres_data:
  media_data:
  static_data:
