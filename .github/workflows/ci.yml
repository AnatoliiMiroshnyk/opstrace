name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: opstrace_test
          POSTGRES_USER: opstrace
          POSTGRES_PASSWORD: opstrace-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opstrace -d opstrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://opstrace:opstrace-ci-password@127.0.0.1:5432/opstrace_test
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest --cov=apps
